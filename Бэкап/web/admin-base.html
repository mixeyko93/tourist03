<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Администратор баз — Брони</title>
  <style>
    :root { --blue:#0a84ff; --green:#24a148; --red:#d32f2f; --gray:#666; }
    html,body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto}
    header{position:sticky;top:0;background:#fff;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;gap:8px;align-items:center}
    header input,header select,header button{height:34px;border:1px solid #ddd;border-radius:8px;padding:0 10px}
    header button{background:var(--blue);color:#fff;border-color:var(--blue);cursor:pointer}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #eee;vertical-align:top}
    th{background:#fafafa;text-align:left;position:sticky;top:58px}
    .container{max-width:1200px;margin:0 auto;padding:10px}
    .status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;color:#fff}
    .pending{background:#999}
    .confirmed{background:var(--green)}
    .cancelled{background:var(--red)}
    .actions button{margin-right:6px;border-radius:8px;border:1px solid; padding:6px 10px; cursor:pointer}
    .confirm{border-color:var(--green);background:var(--green);color:#fff}
    .cancel{border-color:var(--red);background:#fff;color:var(--red)}
    .delete{border-color:#00000022;background:#fff}
    .muted{color:var(--gray);font-size:12px}
    .title{font-weight:700;margin-right:auto}
  </style>
</head>
<body>
<header>
  <div class="title">Брони</div>
  <input id="search" placeholder="Поиск: имя, телефон, база, номер..." />
  <select id="status">
    <option value="">Все статусы</option>
    <option value="pending">Ожидают</option>
    <option value="confirmed">Подтверждённые</option>
    <option value="cancelled">Отменённые</option>
  </select>
  <button onclick="load()">Обновить</button>
</header>

<div class="container">
  <table id="tbl">
    <thead>
      <tr>
        <th>ID</th>
        <th>База / Номер</th>
        <th>Даты</th>
        <th>Гости</th>
        <th>Клиент</th>
        <th>Статус</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="muted" style="display:none">Пока броней нет.</p>
</div>

<script>
async function api(path, opts={}) { const res = await fetch(path, opts); if (!res.ok) throw new Error(await res.text()); return res.json(); }
let all = [];
function matches(row, q, st) { if (st && row.status !== st) return false; if (!q) return true; q=q.toLowerCase(); return [row.customer_name, row.phone, row.camp_name, row.room_name].filter(Boolean).some(x=>String(x).toLowerCase().includes(q)); }
function fmtDate(d) { return new Date(d).toLocaleDateString('ru-RU'); }
function render() {
  const q = document.getElementById('search').value.trim();
  const st = document.getElementById('status').value;
  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = '';
  const rows = all.filter(r => matches(r, q, st));
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.id}</td>
      <td><div><strong>${r.camp_name}</strong><br><span class="muted">${r.room_name}</span></div></td>
      <td>${fmtDate(r.date_from)} — ${fmtDate(r.date_to)}</td>
      <td>${r.guests}</td>
      <td><div>${r.customer_name}<br><span class="muted">${r.phone}</span></div></td>
      <td><span class="status ${r.status}">${r.status}</span></td>
      <td class="actions">
        <button class="confirm"  onclick="setStatus(${r.id}, 'confirmed')">Подтвердить</button>
        <button class="cancel"   onclick="setStatus(${r.id}, 'cancelled')">Отменить</button>
        <button class="delete"   onclick="delBooking(${r.id})">Удалить</button>
      </td>`;
    tbody.appendChild(tr);
  }
}
async function load() { try { all = await api('/api/bookings'); render(); } catch (e) { alert('Не удалось загрузить брони: ' + e.message); } }
async function setStatus(id, status) { try { await api(`/api/bookings/${id}/status?status=${status}`, { method: 'POST' }); const row = all.find(x => x.id === id); if (row) row.status = status; render(); } catch (e) { alert('Ошибка смены статуса: ' + e.message); } }
async function delBooking(id) { if (!confirm('Удалить бронь #' + id + '?')) return; try { await api(`/api/bookings/${id}`, { method: 'DELETE' }); all = all.filter(x => x.id !== id); render(); } catch (e) { alert('Ошибка удаления: ' + e.message); } }

document.getElementById('search').addEventListener('input', render);
document.getElementById('status').addEventListener('change', render);
load();
</script>
</body>
</html>
