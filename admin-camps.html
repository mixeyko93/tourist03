<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Турист_03 CRM</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body.crm-body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #0f1116;
      color: #f4f7ff;
    }
    .crm-layout {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    .crm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: #141826;
    }
    .crm-header__title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .crm-header__user {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      opacity: 0.85;
    }
    .crm-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .crm-sidebar {
      width: 220px;
      background: #141826;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .crm-nav-btn {
      padding: 12px 16px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .crm-nav-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
    }
    .crm-nav-btn.active {
      background: linear-gradient(120deg, #1f2440, #2a3157);
      border-color: transparent;
    }
    .crm-content-area {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      background: #0f1116;
    }
    .crm-view {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .crm-view.active {
      display: flex;
    }
    .crm-section-title {
      font-size: 22px;
      margin: 0;
    }
    .crm-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .crm-input,
    .crm-select {
      background: #151927;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      color: inherit;
      font-size: 14px;
      min-width: 180px;
    }
    .crm-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      background: #151927;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }
    .crm-table thead {
      background: rgba(255, 255, 255, 0.04);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
    }
    .crm-table th,
    .crm-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: left;
    }
    .crm-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .crm-table-wrapper {
      overflow: auto;
      border-radius: 12px;
    }
    .crm-pill {
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 12px;
      text-transform: uppercase;
    }
    .crm-pill--green {
      background: rgba(0, 191, 166, 0.15);
      color: #31ffb1;
    }
    .crm-pill--gray {
      background: rgba(255, 255, 255, 0.08);
      color: #d0d1da;
    }
    .crm-btn-muted {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: inherit;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .crm-btn-muted:hover {
      border-color: rgba(255, 255, 255, 0.45);
    }
    .crm-table-note {
      text-align: center;
      padding: 24px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
  <script src="/static/admin-camps.js" defer></script>
</head>
<body class="crm-body">
  <div class="crm-layout">
    <header class="crm-header">
      <div class="crm-header__title">Турист_03 CRM</div>
      <div class="crm-header__user">
        <span>Администратор</span>
      </div>
    </header>

    <div class="crm-main">
      <aside class="crm-sidebar">
        <button class="crm-nav-btn active" data-crm-view="camps">Базы</button>
        <button class="crm-nav-btn" data-crm-view="bookings">Бронирования</button>
        <button class="crm-nav-btn" data-crm-view="services">Услуги</button>
        <button class="crm-nav-btn" data-crm-view="settings">Настройки</button>
      </aside>

      <section class="crm-content-area">
        <div class="crm-view active" data-crm-panel="camps">
          <h1 class="crm-section-title">Базы отдыха</h1>
          <div class="crm-filters">
            <input type="text" class="crm-input" placeholder="Поиск по названию" disabled>
            <select class="crm-select" disabled>
              <option>Регион (скоро)</option>
            </select>
          </div>
          <div class="crm-table-wrapper">
            <table class="crm-table" id="crm-camps-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Название</th>
                  <th>Регион</th>
                  <th>Активна</th>
                  <th>Действия</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="5" class="crm-table-note">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="crm-view" data-crm-panel="bookings">
          <h1 class="crm-section-title">Бронирования</h1>
          <div class="crm-table-wrapper">
            <table class="crm-table" id="crm-bookings-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>База</th>
                  <th>Заезд</th>
                  <th>Выезд</th>
                  <th>Гости</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="6" class="crm-table-note">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="crm-view" data-crm-panel="services">
          <h1 class="crm-section-title">Услуги</h1>
          <p>Раздел в разработке.</p>
        </div>

        <div class="crm-view" data-crm-panel="settings">
          <h1 class="crm-section-title">Настройки</h1>
          <p>Раздел в разработке.</p>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
