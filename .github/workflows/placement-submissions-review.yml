name: Placement submissions review

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  placement-submissions-review:
    if: github.head_ref == 'feature/placement-submissions-moderation'
    name: Capture placement submissions review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: PLACEMENT_REVIEW_DIR=artifacts/placement-submissions-review python scripts/capture_placement_submissions_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: placement-submissions-review
          path: artifacts/placement-submissions-review
          if-no-files-found: error
          retention-days: 14
