name: Owner Portal review

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  owner-portal-review:
    if: github.head_ref == 'feature/owner-portal'
    name: Capture Owner Portal review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: cd frontend && npm ci && npm run build
      - run: OWNER_PORTAL_REVIEW_DIR=artifacts/owner-portal-review python scripts/capture_owner_portal_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: owner-portal-review
          path: artifacts/owner-portal-review
          if-no-files-found: error
          retention-days: 14
