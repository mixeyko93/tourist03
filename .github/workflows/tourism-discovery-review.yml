name: Tourism discovery review

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tourism-discovery-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tourism-discovery-review:
    if: github.head_ref == 'feature/tourism-discovery'
    name: Capture tourism discovery review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Capture screenshots, Lighthouse and metrics
        env:
          TOURISM_DISCOVERY_REVIEW_DIR: artifacts/tourism-discovery-review
        run: python scripts/capture_tourism_discovery_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: tourism-discovery-review
          path: artifacts/tourism-discovery-review
          if-no-files-found: error
          retention-days: 14
