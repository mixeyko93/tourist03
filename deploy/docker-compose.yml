services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: ..
    volumes:
      - ../static/uploads:/app/static/uploads
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      APP_VERSION: ${APP_VERSION}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_MAX_AGE: ${SESSION_COOKIE_MAX_AGE}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS}
      SUPERADMIN_API_KEY: ${SUPERADMIN_API_KEY}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_LOCAL_BYPASS: ${SUPERADMIN_LOCAL_BYPASS}
      SIM_VERIFY_CODE: ${SIM_VERIFY_CODE}
      TERMS_VERSION: ${TERMS_VERSION}
      ALLOW_SIMULATED_AUTH: ${ALLOW_SIMULATED_AUTH}
      CRM_BASE_URL: ${CRM_BASE_URL}
      SUPERADMIN_BASE_URL: ${SUPERADMIN_BASE_URL}
      STAFF_BOT_TOKEN: ${STAFF_BOT_TOKEN}
      STAFF_BOT_USERNAME: ${STAFF_BOT_USERNAME}
      STAFF_BOT_POLL_INTERVAL: ${STAFF_BOT_POLL_INTERVAL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      UPLOAD_DIR: ${UPLOAD_DIR}
      UPLOAD_IMAGE_MAX_BYTES: ${UPLOAD_IMAGE_MAX_BYTES}
      UPLOAD_VIDEO_MAX_BYTES: ${UPLOAD_VIDEO_MAX_BYTES}
      ALLOW_SERVER_VIDEO_UPLOAD: ${ALLOW_SERVER_VIDEO_UPLOAD}
      RATE_LIMIT_STORAGE: ${RATE_LIMIT_STORAGE}
      REDIS_URL: ${REDIS_URL}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE}
      RATE_LIMIT_PUBLIC_POST_PER_MINUTE: ${RATE_LIMIT_PUBLIC_POST_PER_MINUTE}
      CSRF_LEGACY_COMPATIBILITY: ${CSRF_LEGACY_COMPATIBILITY}
      FEATURE_PUBLIC_BOOKING: ${FEATURE_PUBLIC_BOOKING}
      FEATURE_PUBLIC_USER_AUTH: ${FEATURE_PUBLIC_USER_AUTH}
      FEATURE_OWNER_PORTAL: ${FEATURE_OWNER_PORTAL}
      FEATURE_SERVICES: ${FEATURE_SERVICES}
      FEATURE_TELEGRAM_WEBAPP: ${FEATURE_TELEGRAM_WEBAPP}
      FEATURE_PAID_PLACEMENT: ${FEATURE_PAID_PLACEMENT}
      FEATURE_LEGACY_TOURIST_APP: ${FEATURE_LEGACY_TOURIST_APP}
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build:
      context: ..
    command: ["python", "bot.py"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      CRM_BASE_URL: ${CRM_BASE_URL}
      STAFF_BOT_TOKEN: ${STAFF_BOT_TOKEN}
      STAFF_BOT_USERNAME: ${STAFF_BOT_USERNAME}
      STAFF_BOT_POLL_INTERVAL: ${STAFF_BOT_POLL_INTERVAL}
      ENVIRONMENT: ${ENVIRONMENT}
    depends_on:
      - app
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_ROOT: ${DOMAIN_ROOT}
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_SUPERADMIN: ${DOMAIN_SUPERADMIN}
      DOMAIN_CRM: ${DOMAIN_CRM}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
