<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

  <!-- фон-круг как у иконки карты -->
  <circle cx="32" cy="32" r="28" fill="#0E1621"/>

  <!-- корзина/тележка магазинная -->
  <g fill="none" stroke="#7EB6FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- основной корпус корзины (трапеция) -->
    <path d="M 18 22 L 22 44 Q 22 46 24 46 L 40 46 Q 42 46 42 44 L 46 22 Z"/>
    
    <!-- верхняя линия тележки -->
    <line x1="18" y1="22" x2="46" y2="22"/>
    
    <!-- вертикальная разделитель посередине -->
    <line x1="32" y1="22" x2="32" y2="44"/>
    
  </g>

  <!-- колёса -->
  <g fill="none" stroke="#7EB6FF" stroke-width="3" stroke-linecap="round">
    <!-- левое колесо -->
    <circle cx="24" cy="50" r="3"/>
    <!-- правое колесо -->
    <circle cx="40" cy="50" r="3"/>
  </g>

</svg>