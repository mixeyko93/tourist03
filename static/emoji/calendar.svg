<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>parcel-bordered</title>
  <desc>Единый стиль с компасом: тонкая темно-синяя обводка по всему контуру</desc>

  <g fill-rule="nonzero"
     stroke="#09547B"
     stroke-width="1"
     stroke-linecap="round"
     stroke-linejoin="round"
     vector-effect="non-scaling-stroke">

    <!-- внешний ломаный контур -->
    <path fill="none" d="M 8,16 15,14 83,6 92,78 29,94 22,92 z"/>

    <!-- верх/крышка -->
    <path fill="#287293" d="m 8,16 7,-2 68,-8 3,25 -67,9 -6,1 z"/>
    <path fill="none" d="m 15,15 c 1,7 3,19 4,23"/>

    <!-- корпус -->
    <path fill="#cccccc" d="m 19,39 -6,1 9,52 7,2 C 29,94 92,79 92,78 92,77 86,30 86,30 z"/>
    <path fill="#eeeeee" d="m 86,30 c 0,0 4,22 11,33 -3,6 -14,14 -19,15 -6,1 -45,13 -45,13 0,0 -4,-2 -6,-11 L 19,39 z"/>
    <path fill="#dddddd" d="M 97,63 C 96,62 93,60 93,60 L 81,77 c 0,0 11,-6 16,-14"/>

    <!-- метки/надписи -->
    <path fill="#444444"
          d="m 56,41 22,-4 1,5 c 0,0 -8,13 -5,31 l -6,2 c 0,0 -4,-13 4,-31 L 57,47 z
             M 32,54 c 6,-2 7,-7 8,-11 l 6,-1 8,36 -7,2 -6,-26 c 0,0 -3,5 -7,6 z"/>
  </g>
</svg>
