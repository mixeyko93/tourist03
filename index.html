<!-- web/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Говорим веб-вью и Safari не кэшировать эту страницу -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Турист_03 ⛺️</title>

<!-- Leaflet (карта) — локальные файлы, чтобы приложение не зависело от CDN -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<script src="/static/vendor/leaflet/leaflet.js"></script>

<!-- MarkerCluster (после Leaflet.js) -->
<link rel="stylesheet" href="/static/vendor/leaflet-markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/static/vendor/leaflet-markercluster/MarkerCluster.Default.css">
<script src="/static/vendor/leaflet-markercluster/leaflet.markercluster.js"></script>

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Scroll helpers (iOS/Android) -->
<script defer src="/static/scroll.js?v=2026-01-10-04"></script>

  <!-- Наши стили -->
<link rel="stylesheet" href="/static/styles.css?v=2026-01-10-04" />


</head>
<body>
  <div class="tg-app">

<section id="tab-map" class="tab-content">
  <div class="map-wrap">
    <div id="map"></div>

<div class="map-ui">
  <!-- Телеграм-emoji (локальные SVG), статично на всех ОС -->
<!-- Календарь -->
<button class="map-btn left" id="openBookingFilter" title="Выбрать даты" aria-label="Выбрать даты">
  <!-- было: /static/emoji/tg_calendar.svg -->
  <img src="/static/emoji/calendar.svg" alt="" class="tg-emoji">
</button>

<!-- Черновик бронирования (корзина) -->
<button class="map-btn left draft cart-btn" id="openBookingDraft" title="Корзина бронирования" aria-label="Корзина бронирования">
  <img src="/static/emoji/shopping-cart.svg" alt="" class="tg-emoji">
  <span class="map-badge" id="bookingDraftBadge" aria-hidden="true" style="display:none;">1</span>
</button>

<!-- Компас -->
<button class="map-btn right" id="geoBtn" title="Моё местоположение" aria-label="Моё местоположение">
  <!-- было: /static/emoji/tg_compass.svg -->
  <img src="/static/emoji/compass.svg" alt="" class="tg-emoji">
</button>

<!-- Обновить карту -->
<button class="map-btn right text-btn" id="refreshMap" type="button" title="Обновить карту" aria-label="Обновить карту">
  Обновить карту
</button>

</div>

  </div>
</section>

    <!-- Вкладка: Личный кабинет -->
    <section id="tab-account" class="tab-content" style="display:none;">
      <h1 class="page-title" id="accountTitle">Личный кабинет</h1>

      <div class="account-shell">
        <!-- Блок гостя (покажется, когда не авторизован) -->
        <div class="card account-card" id="accountGuest">
          <p class="muted">Для входа в личный кабинет и бронирования необходимо авторизоваться.</p>
          <div class="account-actions">
            <button class="button primary" id="btnLoginOpen">Вход</button>
            <button class="button ghost"   id="btnRegisterOpen">Регистрация</button>
          </div>
        </div>

        <!-- Блок пользователя (скрыт по умолчанию; отрисует app.js) -->
        <div class="card account-card" id="accountUser" style="display:none; visibility:hidden;">
        </div>

        <div class="card account-card" id="accountActions" style="display:none;">
          <div class="account-actions stack">
            <button class="button ghost" id="btnAccountActive">Активные бронирования</button>
            <button class="button ghost" id="btnAccountHistory">История бронирований</button>
            <button class="button ghost" id="btnAccountProfile">Личные данные</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Вкладка: Услуги -->
    <section id="tab-services" class="tab-content" style="display:none;">
      <h1 class="page-title">Услуги</h1>
      <div class="card"><p class="muted">Раздел находится в разработке.</p></div>
    </section>

    <!-- Вкладка: Помощь -->
    <section id="tab-help" class="tab-content" style="display:none;">
      <h1 class="page-title">Помощь</h1>
      <div class="card"><p class="muted">По вопросам работы приложения пишите в поддержку @tourist_03_bot</p></div>
    </section>

<!-- Нижнее меню (кастомные SVG-иконки) -->
<nav class="tabbar">
  <div class="tab active" data-target="tab-map">
    <div class="icon" aria-hidden="true">
      <!-- map.svg inline -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/>
        <path d="M9 4v14"/>
        <path d="M15 6v14"/>
      </svg>
    </div>
    <div class="label">Карта</div>
  </div>

  <div class="tab" data-target="tab-account">
    <div class="icon" aria-hidden="true">
      <!-- user.svg inline -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="7.5" r="4"/>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
      </svg>
    </div>
    <div class="label">Личный кабинет</div>
  </div>

  <div class="tab" data-target="tab-services">
    <div class="icon" aria-hidden="true">
      <!-- bell.svg inline -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
        <path d="M13.7 21a2 2 0 01-3.4 0"/>
      </svg>
    </div>
    <div class="label">Услуги</div>
  </div>

  <div class="tab" data-target="tab-help">
    <div class="icon" aria-hidden="true">
      <!-- help.svg inline -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.1 9a3 3 0 115.8 1c0 2-3 2-3 4"/>
        <circle cx="12" cy="17" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="label">Помощь</div>
  </div>
</nav>


  </div>

  <!-- Модальное окно (ВАЖНО: требуется app.js) -->
  <div id="modal" class="modal" style="display:none;">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <!-- Скрипты -->
  <script defer src="/static/ui.js?v=2026-01-10-04"></script>
  <script defer src="/static/app.js?v=2026-01-10-04"></script>

</body>
</html>
